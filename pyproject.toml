[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aibenchmark-esw"
dynamic = ["version"]
description = "Embedded AI Coding Benchmark Framework (AIBenchMark-ESW)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "AIBenchMark-ESW Contributors" }
]
keywords = ["embedded", "ai-benchmark", "llm-eval", "c99", "unity", "misra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sentimentalmija-lgtm/AIBenchMark-ESW"
Repository = "https://github.com/sentimentalmija-lgtm/AIBenchMark-ESW"
Issues = "https://github.com/sentimentalmija-lgtm/AIBenchMark-ESW/issues"
Documentation = "https://github.com/sentimentalmija-lgtm/AIBenchMark-ESW/blob/main/README.md"

[project.optional-dependencies]
dev = ["build>=1.0.0", "setuptools>=77.0", "wheel", "ruff>=0.6", "mypy>=1.11,<2.5", "coverage>=7.6", "jsonschema>=4.18"]
llm = ["litellm>=1.0.0"]
full = ["litellm>=1.0.0"]
schema = ["jsonschema>=4.18"]

[project.scripts]
aibenchmark-esw = "aibenchmark_esw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aibenchmark_esw*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "aibenchmark_esw.__version__"}

[tool.setuptools.package-data]
aibenchmark_esw = ["py.typed", "schemas/*.json"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
files = ["aibenchmark_esw"]

[tool.coverage.run]
source = ["aibenchmark_esw"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
