[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aibenchmark-esw"
version = "0.1.0"
description = "Embedded AI Coding Benchmark Framework (AIBenchMark-ESW)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AIBenchMark-ESW Contributors" }
]
keywords = ["embedded", "ai-benchmark", "llm-eval", "c99", "unity", "misra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0.0", "setuptools>=61.0", "wheel"]
llm = ["litellm>=1.0.0"]
full = ["litellm>=1.0.0", "rich>=13.0.0"]

[project.scripts]
aibenchmark-esw = "aibenchmark_esw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aibenchmark_esw*"]
