name: Benchmark validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
            compiler: gcc
          - os: ubuntu-24.04
            python: '3.13'
            compiler: gcc
          - os: ubuntu-24.04
            python: '3.10'
            compiler: gcc
          - os: ubuntu-24.04
            python: '3.12'
            compiler: gcc
          - os: ubuntu-24.04
            python: '3.11'
            compiler: clang
          - os: windows-latest
            python: '3.11'
            compiler: tcc
          - os: macos-latest
            python: '3.11'
            compiler: clang
    env:
      AIBENCHMARK_ESW_COMPILER: ${{ matrix.compiler }}
      AIBENCHMARK_ESW_CPPCHECK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc clang gcc-avr avr-libc binutils-avr
      - name: Install verified Windows TCC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'tcc.zip'
          $expected = '34a721949a2583fdff725312da092fa0f5f1f284b702e6f811c6954714faabb2'
          $downloaded = $false
          $mirrors = @(
            'https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip',
            'https://mirror.csclub.uwaterloo.ca/nongnu/tinycc/tcc-0.9.27-win64-bin.zip',
            'https://nongnu.askapache.com/tinycc/tcc-0.9.27-win64-bin.zip'
          )
          foreach ($mirror in $mirrors) {
            try {
              Invoke-WebRequest $mirror -OutFile $archive -TimeoutSec 20
              if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
                throw 'Downloaded TCC checksum does not match'
              }
              $downloaded = $true
              break
            } catch {
              Write-Warning "TCC download failed or mismatched at $mirror; trying next verified source"
            }
          }
          if (-not $downloaded) { throw 'Could not download the pinned TCC archive from any source' }
          $destination = Join-Path $env:RUNNER_TEMP 'tcc-toolchain'
          Expand-Archive $archive -DestinationPath $destination
          (Join-Path $destination 'tcc') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate required task assets
        run: aibenchmark-esw validate
      - name: Check published evidence fingerprints
        run: python -m aibenchmark_esw.baseline_check results/baseline.json
      - name: Lint and type-check Python
        run: |
          ruff check aibenchmark_esw
          mypy aibenchmark_esw
      - name: Run full suite including distribution validation
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml -o artifacts/coverage.xml
      - name: Check mutation adequacy
        run: aibenchmark-esw mutations --output artifacts/mutations.json
      - name: Check cross-target object evidence
        if: runner.os == 'Linux'
        run: |
          aibenchmark-esw run --model baseline --target arm:cortex-m0 --cross-compiler clang --tasks tier1_crc16 --output artifacts/arm-cortex-m0.json
          aibenchmark-esw run --model baseline --target riscv:rv32imac --cross-compiler clang --tasks tier1_crc16 --output artifacts/riscv-rv32imac.json
      - name: Check all task ARM and AVR footprints
        if: runner.os == 'Linux'
        run: |
          aibenchmark-esw run --model baseline --target arm:cortex-m0 --cross-compiler clang --output artifacts/arm-all-tasks.json
          aibenchmark-esw run --model baseline --target avr:atmega328p --cross-compiler avr-gcc --output artifacts/avr-all-tasks.json
      - name: Record reference baseline
        run: aibenchmark-esw run --model baseline --output artifacts/baseline.json
      - name: Render reference report
        shell: bash
        run: aibenchmark-esw report --results artifacts/baseline.json --format markdown > artifacts/baseline.md
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.compiler }}
          path: artifacts/
          if-no-files-found: ignore

  cppcheck:
    name: Cppcheck integration / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIBENCHMARK_ESW_TEST_CPPCHECK: cppcheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install cppcheck and its library configuration
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck gcc
      - name: Install benchmark
        run: python -m pip install -e .
      - name: Validate actual analyzer execution and diagnostics
        run: |
          cppcheck --version
          python -m unittest discover -s tests -p test_cppcheck_integration.py -v

  msvc:
    name: MSVC C11 fallback / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AIBENCHMARK_ESW_CPPCHECK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Initialize installed Visual Studio toolchain
        shell: pwsh
        run: |
          $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $locator -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation was not found' }
          $developerCommand = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $bootstrapPath = Join-Path $env:RUNNER_TEMP 'aibenchmark-msvc-env.cmd'
          @('@echo off', "call `"$developerCommand`" -no_logo -arch=x64 -host_arch=x64 >nul", 'if errorlevel 1 exit /b 1', 'set') | Set-Content -LiteralPath $bootstrapPath -Encoding ascii
          $developerEnvironment = & cmd.exe /d /c $bootstrapPath
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($entry in $developerEnvironment) {
            if ($entry -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Install benchmark and validate native MSVC evaluation
        run: |
          python -m pip install -e ".[dev]"
          aibenchmark-esw validate
          aibenchmark-esw run --model baseline --compiler cl --allow-standard-fallback --output artifacts/msvc-baseline.json
          aibenchmark-esw mutations --compiler cl --allow-standard-fallback --output artifacts/msvc-mutations.json
          aibenchmark-esw validate-report artifacts/msvc-baseline.json
      - name: Upload MSVC evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-windows-msvc
          path: artifacts/
          if-no-files-found: ignore

  containment:
    name: Sanitizers and real Docker containment / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIBENCHMARK_ESW_CPPCHECK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compilers and benchmark
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc clang
          python -m pip install -e ".[dev]"
      - name: Exercise real sanitizer runtimes
        run: |
          python -m unittest discover -s tests -p test_runtime_controls.py -v
          aibenchmark-esw run --model baseline --compiler clang --sanitizers address,undefined --output artifacts/sanitized-baseline.json
      - name: Pull compiler image and exercise actual Docker boundaries
        env:
          AIBENCHMARK_TEST_CONTAINER: '1'
        run: |
          docker pull gcc:14
          python -m unittest discover -s tests -p test_containment.py -v
          aibenchmark-esw run --model baseline --isolation container --container-engine docker --container-image gcc:14 --memory-limit-bytes 536870912 --output artifacts/container-baseline.json
          aibenchmark-esw validate-report artifacts/container-baseline.json
      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-linux-containment
          path: artifacts/
          if-no-files-found: ignore
